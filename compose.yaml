x-app: &app
  image: jungle-wagering:local
  build:
    context: .
  init: true
  environment:
    NODE_ENV: production
    DATABASE_URL: postgres://wagering:wagering_local@postgres:5432/wagering
    SQS_ENDPOINT: http://localstack:4566
    AWS_REGION: us-east-1
    AWS_ACCESS_KEY_ID: test
    AWS_SECRET_ACCESS_KEY: test
    REFERENCE_TTL_MS: "3600000"
  stop_grace_period: 60s
  restart: unless-stopped

x-ready: &ready
  postgres:
    condition: service_healthy
  localstack:
    condition: service_healthy
  migrate:
    condition: service_completed_successfully
  setup-queues:
    condition: service_completed_successfully

x-api: &api
  <<: *app
  command: ["bun", "src/main.ts"]
  depends_on: *ready
  healthcheck:
    test:
      - CMD
      - bun
      - -e
      - "const r = await fetch('http://127.0.0.1:3000/health/ready'); process.exit(r.ok ? 0 : 1)"
    interval: 10s
    timeout: 5s
    retries: 10
    start_period: 15s

services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: wagering
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  localstack:
    image: localstack/localstack:4.14.0
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_ENDPOINT_STRATEGY: dynamic
    ports:
      - "127.0.0.1:4566:4566"
    healthcheck:
      test:
        - CMD
        - awslocal
        - sqs
        - list-queues
        - --region
        - us-east-1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  migrate:
    <<: *app
    restart: "no"
    command:
      - bun
      - run
      - db
      - migration:up
      - --config
      - ./src/infrastructure/database/mikro-orm.config.ts
    depends_on:
      postgres:
        condition: service_healthy

  setup-queues:
    <<: *app
    restart: "no"
    command:
      - bun
      - src/infrastructure/messaging/setup-queues.ts
    depends_on:
      localstack:
        condition: service_healthy

  api-1:
    <<: *api
    ports:
      - "127.0.0.1:3001:3000"

  api-2:
    <<: *api
    ports:
      - "127.0.0.1:3002:3000"

  api-3:
    <<: *api
    ports:
      - "127.0.0.1:3003:3000"

  wager-worker:
    <<: *app
    command:
      - bun
      - src/infrastructure/messaging/wager-worker.ts
    depends_on: *ready

  outbox-worker:
    <<: *app
    command:
      - bun
      - src/infrastructure/messaging/outbox-worker.ts
    depends_on: *ready

  reference-worker:
    <<: *app
    command:
      - bun
      - src/infrastructure/messaging/reference-worker.ts
    depends_on: *ready

volumes:
  postgres_data: